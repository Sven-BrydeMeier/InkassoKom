# Alembic Configuration for InkassoKom
# Database migrations for Supabase/PostgreSQL

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend date to migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(slug)s

# Timezone for revision dates
timezone = UTC

# Max length of revision IDs
truncate_slug_length = 40

# Set to 'true' to run the environment during startup
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without source
sourceless = false

# Version path separator
version_path_separator = os

# Version locations
# version_locations = %(here)s/migrations/versions

# sqlalchemy.url will be set dynamically from environment
# sqlalchemy.url = postgresql://user:pass@localhost/dbname


[post_write_hooks]
# Hooks executed after migrations are written
# hooks = black
# black.type = console_scripts
# black.entrypoint = black


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
